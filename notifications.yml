# Sends race reminders and new-race alerts every morning (Ghana time = UTC).
# Needs repository secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GMAIL_USER, GMAIL_APP_PASSWORD
# and the variable SITE_URL (see README → "Runner emails"). Without them it does nothing.
name: Send race reminders and alerts

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run: list what would be sent, send nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send emails
        run: npm run notify -- ${{ inputs.dry && '--dry' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
